spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL  # 메모리 모드 H2
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never # data.sql 자동 실행 방지
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        # 예약어 오류 방지 (User, Order 등을 테이블 이름으로 쓸 수 있게 함)
        globally_quoted_identifiers: true